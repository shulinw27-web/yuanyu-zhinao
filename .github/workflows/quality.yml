name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run quality
      - run: npm run migrate:verify
      - run: npm run build
      - run: npm run build:mobile
      - run: npm run build:desktop

  sbom-and-licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: mkdir -p output && npm run security:sbom && npm run security:licenses
      - uses: actions/upload-artifact@v4
        with:
          name: software-supply-chain
          path: |
            output/sbom.cdx.json
            output/third-party-licenses.json
          retention-days: 30
