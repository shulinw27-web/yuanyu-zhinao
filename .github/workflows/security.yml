name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 2 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  dependency-and-secret-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run security:gate
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3

  container-and-iac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production API image
        run: docker build --pull --file deploy/Dockerfile.api --tag agent-platform-api:${{ github.sha }} .
      - name: Scan image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@0.32.0
        with:
          image-ref: agent-platform-api:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - name: Scan deployment configuration
        uses: aquasecurity/trivy-action@0.32.0
        with:
          scan-type: config
          scan-ref: deploy
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
