apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: agent-platform-api
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: agent-platform-api }
  minReplicas: 3
  maxReplicas: 12
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 65 }
    - type: Resource
      resource:
        name: memory
        target: { type: Utilization, averageUtilization: 75 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-platform-api-default-deny
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: agent-platform-api } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { app.kubernetes.io/name: ingress-system } }
      ports: [{ protocol: TCP, port: 3001 }]
  # 生产环境按 DNS、IdP、KMS、数据库、Broker、SIEM 与 Connector 目标进一步收窄。
  egress: []
