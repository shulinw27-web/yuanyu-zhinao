      tags: [Alerting]
      operationId: saveAlertingConfiguration
      x-button-permission: notification.policy.publish
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: true } } }
      responses:
        '200': { $ref: '#/components/responses/MutationSucceeded' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /alerting/simulations:
    post:
      tags: [Alerting]
      operationId: simulateAlertRoute
      x-button-permission: notification.simulate
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: true } } }
      responses:
        '200': { $ref: '#/components/responses/MutationSucceeded' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /procurement/scenario:
    get:
      tags: [Procurement]
      operationId: getProcurementScenario
      responses:
        '200': { description: Mock 采购协同场景, content: { application/json: { schema: { $ref: '#/components/schemas/GenericObject' } } } }
  /procurement/launch:
    post:
      tags: [Procurement]
      operationId: launchProcurement
      x-button-permission: procurement.launch
      responses:
        '200': { $ref: '#/components/responses/MutationSucceeded' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /procurement/approve:
    post:
      tags: [Procurement]
      operationId: approveProcurement
      x-button-permission: procurement.approve
      responses:
        '200': { $ref: '#/components/responses/MutationSucceeded' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /simulation/overview:
    get:
      tags: [Simulation]
      operationId: getSimulationOverview
      responses:
        '200': { description: Mock 连接器、场景、审批与事件流, content: { application/json: { schema: { $ref: '#/components/schemas/GenericObject' } } } }
  /simulation/scenarios/{id}/run:
    post:
      tags: [Simulation]
      operationId: runSimulationScenario
      x-button-permission: simulation.run
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      responses:
        '200': { $ref: '#/components/responses/MutationSucceeded' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /system-data/{systemId}/records:
    get:
      tags: [Simulation]
      operationId: listSystemDataRecords
      parameters:
        - { name: systemId, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500 } }
      responses:
        '200': { description: 按系统与数据权限过滤的模拟业务记录, content: { application/json: { schema: { $ref: '#/components/schemas/GenericObject' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /key-center/overview:
    get:
      tags: [Platform]
      operationId: getKeyCenterOverview
      responses:
        '200': { description: 脱敏后的密钥策略和租约状态, content: { application/json: { schema: { $ref: '#/components/schemas/GenericObject' } } } }
  /domain-events/outbox:
    get:
      tags: [Platform]
      operationId: listDomainEventOutbox
      x-page-permission: page.config.view
      x-button-permission: event.outbox.view
      parameters:
        - { name: status, in: query, schema: { enum: [pending, processing, published, dead_letter] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        '200':
          description: 当前租户的领域事件及送达契约
          content:
            application/json:
              schema:
                type: object
                required: [items, metrics, consumers, deliveryContract]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/DomainEvent' } }
                  metrics: { $ref: '#/components/schemas/GenericObject' }
                  consumers: { type: array, items: { $ref: '#/components/schemas/GenericObject' } }
                  deliveryContract: { $ref: '#/components/schemas/GenericObject' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /domain-events/contracts:
    get:
      tags: [Platform]
      operationId: listDomainEventContracts
      x-page-permission: page.config.view
      x-button-permission: event.outbox.view
      responses:
        '200': { description: 已注册的领域事件版本与必填载荷字段, content: { application/json: { schema: { $ref: '#/components/schemas/GenericObject' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /domain-events/outbox/{id}/replay:
    post:
      tags: [Platform]
      operationId: replayDomainEventDeadLetter
      x-button-permission: event.outbox.replay
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 300 }
      responses:
        '200': { description: 死信已恢复为待消费状态, content: { application/json: { schema: { $ref: '#/components/schemas/DomainEvent' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: 事件不存在或当前状态不可重放, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /semantic-operations/tasks:
    get:
      tags: [SemanticOperations]
      operationId: listSemanticOperationsTasks
      responses:
        '200': { description: 当前身份可见的连续语义任务, content: { application/json: { schema: { $ref: '#/components/schemas/GenericObject' } } } }
    post:
      tags: [SemanticOperations]
      operationId: createSemanticOperationsTask
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SemanticTaskRequest' } } }
      responses:
        '201': { description: 已创建只读结果或待确认语义任务, content: { application/json: { schema: { $ref: '#/components/schemas/GenericObject' } } } }
  /semantic-operations/tasks/{id}/trace:
    get:
      tags: [SemanticOperations, Evidence]
      operationId: getSemanticOperationsTaskTrace
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: 当前身份可见的哈希证据链, content: { application/json: { schema: { $ref: '#/components/schemas/GenericObject' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /semantic-operations/tasks/{id}/confirmation:
    post:
      tags: [SemanticOperations]
      operationId: confirmSemanticOperationsTask
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: 签发一次性、指纹绑定的确认凭证, content: { application/json: { schema: { $ref: '#/components/schemas/GenericObject' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /semantic-operations/tasks/{id}/execute:
    post:
      tags: [SemanticOperations]
      operationId: executeSemanticOperationsTask
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [confirmationToken], properties: { confirmationToken: { type: string } } } } } }
      responses:
        '200': { description: 已执行受控语义命令, content: { application/json: { schema: { $ref: '#/components/schemas/GenericObject' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /semantic-operations/inspections:
    get:
      tags: [SemanticOperations]
      operationId: listSemanticInspectionSchedules
      responses: { '200': { description: 只读巡检计划, content: { application/json: { schema: { $ref: '#/components/schemas/GenericObject' } } } } }
    post:
      tags: [SemanticOperations]
      operationId: createSemanticInspectionSchedule
      x-button-permission: meta_model.draft.validate
      responses: { '201': { description: 已创建只读巡检计划, content: { application/json: { schema: { $ref: '#/components/schemas/GenericObject' } } } } }
  /semantic-operations/notifications:
    get:
      tags: [SemanticOperations]
      operationId: listSemanticOperationsNotifications
      responses: { '200': { description: 当前身份的元域智语通知, content: { application/json: { schema: { $ref: '#/components/schemas/GenericObject' } } } } }
  /semantic-operations/tasks/{id}/report-export:
    post:
      tags: [SemanticOperations, Evidence]
      operationId: recordSemanticOperationsReportExport
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: 已记录桌面端受控导出哈希回执, content: { application/json: { schema: { $ref: '#/components/schemas/GenericObject' } } } } }
components:
  securitySchemes:
    sessionHeader:
      type: apiKey
      in: header
      name: x-oa-session
    oidcBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 企业 OIDC Access Token；服务端通过 JWKS、issuer、audience、租户和算法白名单验证。
  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema: { type: string, minLength: 1 }
  schemas:
    AnomalySource:
      type: object
      additionalProperties: false
      required: [kind, text]
      properties:
        kind: { type: string, enum: [text, manual_transcript, mock_group] }
        text: { type: string, maxLength: 6000 }
        materialConfirmed: { type: boolean }
        attachments:
          type: array
          maxItems: 1
          items:
            type: object
            required: [name, mimeType, dataUrl]
            properties:
              name: { type: string, maxLength: 120 }
              mimeType: { type: string }
              dataUrl: { type: string }
    MemoryCorrectionInput:
      type: object
      additionalProperties: false
      required: [content, expectedFingerprint, confirmed]
      properties:
        content: { type: string, minLength: 4, maxLength: 8000 }
        expectedFingerprint: { type: string, pattern: '^[a-f0-9]{64}$' }
        confirmed: { const: true }
    KnowledgeSupplementInput:
      type: object
      additionalProperties: false
      required: [question, citations, confirmed]
      properties:
        question: { type: string, minLength: 1, maxLength: 4000 }
        citations: { type: array, minItems: 1, maxItems: 5, items: { $ref: '#/components/schemas/KnowledgeCitation' } }
        confirmed: { const: true }
    ReadPlanProposalInput:
      type: object
      additionalProperties: false
      required: [request, rootType, expectedFingerprint, consent]
      properties:
        request: { type: string, minLength: 1, maxLength: 4000 }
        rootType: { type: string }
        joinSelections:
          type: array
          maxItems: 23
          description: 人工明确选择的已声明外键路径；同类多角色须使用人工多别名方案。发现歧义时返回409及joinChoices，不返回候选方案。
          items:
            type: object
            additionalProperties: false
            required: [objectType, fromObjectType, field, sourceField]
            properties:
              objectType: { type: string }
              fromObjectType: { type: string }
              field: { type: string }
              sourceField: { type: string }
        expectedFingerprint: { type: string, pattern: '^[a-f0-9]{24}$' }
        consent:
          type: object
          additionalProperties: false
          required: [provider, model, confirmed]
          properties:
            provider: { type: string }
            model: { type: string }
            confirmed: { const: true }
    KnowledgeAnswerInput:
      type: object
      additionalProperties: false
      required: [question, history, citations, consent]
      properties:
        question: { type: string, minLength: 1, maxLength: 4000 }
        history: { type: array, maxItems: 6, description: 仅用户问题，总长度最多6000字符，不接收旧模型回答, items: { type: string, minLength: 1, maxLength: 4000 } }
        purpose: { enum: [answer, wiki], default: answer }
        citations: { type: array, minItems: 1, maxItems: 5, items: { $ref: '#/components/schemas/KnowledgeCitation' } }
        consent:
          type: object
          additionalProperties: false
          required: [provider, model, confirmed]
          properties:
            provider: { type: string }
            model: { type: string }
            confirmed: { const: true }
    KnowledgeBusinessBriefInput:
      type: object
      additionalProperties: false
      required: [question, targets, citations, confirmed]
      properties:
        planId: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,99}$', description: 多方案时必须明确选择；单方案兼容省略 }
        expectedModelFingerprint: { type: string, pattern: '^[a-f0-9]{24}$', description: 界面取得的模型指纹；变化时拒绝读取 }
        expectedModelVersion: { type: string, minLength: 1, maxLength: 100 }
        question: { type: string, minLength: 1, maxLength: 4000 }
        targets: { type: array, minItems: 1, maxItems: 3, uniqueItems: true, items: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,99}$' } }
        citations: { type: array, minItems: 1, maxItems: 5, items: { $ref: '#/components/schemas/KnowledgeCitation' } }
        confirmed: { const: true }
    KnowledgeMaterialInput:
      type: object
      additionalProperties: false
      required: [attachments, confirmed]
      properties:
        confirmed: { const: true }
        attachments:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: object
            required: [name, mimeType, dataUrl]
            properties:
              name: { type: string, maxLength: 120 }
              mimeType: { type: string }
              dataUrl: { type: string, description: 受控 MIME 的规范 Base64，实际文件签名校验，最大4MiB }
    KnowledgeStudyPrepareInput:
      type: object
      additionalProperties: false
      required: [title, citations]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        citations: { type: array, minItems: 1, maxItems: 5, items: { $ref: '#/components/schemas/KnowledgeCitation' } }
    KnowledgeStudyRestoreInput:
      type: object
      additionalProperties: false
      required: [revision, expectedRevision, confirmed]
      properties:
        revision: { type: integer, minimum: 1 }
        expectedRevision: { type: integer, minimum: 1 }
        confirmed: { const: true }
    KnowledgeStudyInput:
      type: object
      additionalProperties: false
      required: [title, notes, expectedRevision, citations, confirmed]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        notes: { type: string, minLength: 1, maxLength: 8000 }
        expectedRevision: { type: integer, minimum: 0 }
        confirmed: { const: true }
        citations: { type: array, minItems: 1, maxItems: 5, items: { $ref: '#/components/schemas/KnowledgeCitation' } }
    KnowledgeBriefInput:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        query: { type: string, minLength: 1, maxLength: 4000 }
        limit: { type: integer, minimum: 1, maximum: 5, default: 5 }
        provider: { type: string, enum: [local_private_library, weknora_local], default: local_private_library }
    KnowledgeCitation:
      oneOf:
        - { $ref: '#/components/schemas/LocalKnowledgeCitation' }
        - { $ref: '#/components/schemas/WeKnoraKnowledgeCitation' }
    WeKnoraKnowledgeCitation:
      type: object
      additionalProperties: false
      required: [provider, knowledgeBaseId, documentId, chunkId, revision, location]
      properties:
        provider: { const: weknora_local }
        knowledgeBaseId: { type: string, minLength: 1, maxLength: 100 }
        documentId: { type: string, minLength: 1, maxLength: 100 }
        chunkId: { type: string, minLength: 1, maxLength: 100 }
        revision: { type: string, pattern: '^[a-f0-9]{64}$' }
        location: { const: provider_chunk_not_pdf_coordinates }
    LocalKnowledgeCitation:
      type: object
      additionalProperties: false
      required: [provider, documentId, revision, contentHash, chunkId, start, end, location]
      properties:
        provider: { const: local_private_library }
        documentId: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,99}$' }
        revision: { type: integer, minimum: 1 }
        contentHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        chunkId: { type: string, minLength: 1, maxLength: 150 }
        start: { type: integer, minimum: 0 }
        end: { type: integer, minimum: 1 }
        location: { const: text_offsets }
    GenericObject:
      type: object
      additionalProperties: true
    GenericArray:
      type: array
      items: { $ref: '#/components/schemas/GenericObject' }
    DomainEvent:
      type: object
      required: [eventId, type, version, tenantId, aggregateType, aggregateId, status, occurredAt]
      properties:
        eventId: { type: string, format: uuid }
        type: { type: string }
        version: { type: integer, minimum: 1 }
        tenantId: { type: string }
        organizationId: { type: [string, 'null'] }
        aggregateType: { type: string }
        aggregateId: { type: string }
        correlationId: { type: [string, 'null'] }
        causationId: { type: [string, 'null'] }
        actor: { $ref: '#/components/schemas/GenericObject' }
        payload: { $ref: '#/components/schemas/GenericObject' }
        status: { enum: [pending, processing, published, dead_letter] }
        attempts: { type: integer, minimum: 0 }
        replayCount: { type: integer, minimum: 0 }
        lastReplay: { type: [object, 'null'], additionalProperties: true }
        occurredAt: { type: string, format: date-time }
    LocalLoginRequest:
      type: object
      required: [account, password]
      properties:
        account: { type: string, minLength: 1 }
        password: { type: string, minLength: 1, writeOnly: true }
    PermissionRoleAssignment:
      type: object
      required: [version, roleIds, orgUnitId]
      properties:
        version: { type: integer, minimum: 1 }
        roleIds: { type: array, minItems: 1, uniqueItems: true, items: { type: string } }
        orgUnitId: { type: string }
    RolePolicyMutation:
      type: object
      required: [version, menuIds, pagePermissionIds, buttonPermissionIds, dataScope]
      properties:
        version: { type: integer, minimum: 1 }
        menuIds: { type: array, uniqueItems: true, items: { type: string } }
        pagePermissionIds: { type: array, uniqueItems: true, items: { type: string } }
        buttonPermissionIds: { type: array, uniqueItems: true, items: { type: string } }
        dataScope:
          type: object
          required: [mode]
          properties:
            mode: { enum: [self, current_org, org_and_descendants, selected_orgs, all] }
            organizationIds: { type: array, uniqueItems: true, items: { type: string } }
    ApiError:
      type: object
      required: [message]
      properties:
        message: { type: string }
        code: { type: [string, 'null'] }
        requestId: { type: [string, 'null'] }
        details: { type: object, additionalProperties: true }
    EffectiveAccess:
      type: object
      required: [roleIds, menuIds, pagePermissionIds, buttonPermissionIds, allowedOrgIds]
      properties:
        primaryRoleId: { type: [string, 'null'] }
        roleIds: { type: array, items: { type: string } }
        menuIds: { type: array, items: { type: string } }
        pagePermissionIds: { type: array, items: { type: string } }
        buttonPermissionIds: { type: array, items: { type: string } }
        allowedOrgIds: { type: array, items: { type: string } }
      additionalProperties: true
    AgentInput:
      type: object
      properties:
        text: { type: string }
        conversationId: { type: string }
        attachments:
          type: array
          items:
            type: object
            required: [name, mimeType, dataUrl]
            properties:
              name: { type: string }
              mimeType: { type: string }
              dataUrl: { type: string }
    SemanticTaskRequest:
      type: object
      properties:
        text: { type: string, maxLength: 4000 }
        parentTaskId: { type: string }
        attachments:
          type: array
          maxItems: 5
          items:
            type: object
            required: [name, mimeType, dataUrl]
            properties:
              name: { type: string }
              mimeType: { type: string }
              dataUrl: { type: string }
    AgentMessageRequest:
      type: object
      required: [input]
      properties:
        input: { $ref: '#/components/schemas/AgentInput' }
    LegacyAgentMessageRequest:
      type: object
      properties:
        text: { type: string }
        conversationId: { type: string }
        attachments: { type: array, items: { type: object } }
    AgentExecuteRequest:
      type: object
      required: [runId, commandId, confirmationToken]
      properties:
        runId: { type: string }
        commandId: { type: string }
        confirmationToken: { type: string }
    AgentOrchestrationRequest:
      type: object
      additionalProperties: false
      required: [goal, schedule, steps]
      properties:
        title: { type: string, maxLength: 120 }
        goal: { type: string, minLength: 1, maxLength: 2000 }
        schedule:
          type: object
          additionalProperties: true
          required: [type]
          properties:
            type: { enum: [once, interval] }
            runAt: { type: string, format: date-time }
            startAt: { type: string, format: date-time }
            intervalMinutes: { type: integer, minimum: 15, maximum: 43200 }
            timezone: { type: string, maxLength: 80 }
        steps:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [id, title, mode]
            properties:
              id: { type: string, maxLength: 80 }
              title: { type: string, maxLength: 160 }
              mode: { enum: [read, analysis, proposal] }
              dependsOn: { type: array, uniqueItems: true, items: { type: string } }
    AgentResponse:
      type: object
      required: [text, agent, evidence, plan, command]
      properties:
        text: { type: string }
        agent: { type: object, additionalProperties: true }
        evidence: { type: array, items: { type: object, additionalProperties: true } }
        plan: { type: array, items: { type: object, additionalProperties: true } }
        command: { oneOf: [{ type: 'null' }, { type: object, additionalProperties: true }] }
        runId: { type: [string, 'null'] }
      additionalProperties: true
  responses:
    MutationSucceeded:
      description: 受控业务动作执行成功并返回审计信息
      content: { application/json: { schema: { $ref: '#/components/schemas/GenericObject' } } }
    BadRequest:
      description: 请求格式错误
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    Unauthorized:
      description: 未认证或会话失效
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    Forbidden:
      description: 页面、按钮、数据域或业务权限拒绝
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    Conflict:
      description: 乐观锁版本冲突或状态冲突
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    NotFound:
      description: 资源不存在或不可见
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
