openapi: 3.1.0
info:
  title: 元域智脑核心 API
  version: 0.1.0
  description: 多人协作阶段的核心契约基线；其他模块按 docs/modules 中的 API 文档逐步纳入。
servers:
  - url: /api
security:
  - sessionHeader: []
  - oidcBearer: []
tags:
  - { name: Identity, description: 身份、会话与演示角色目录 }
  - { name: IAM, description: 有效权限、人员角色与数据权限 }
  - { name: Risk, description: 风险识别、详情和处置 }
  - { name: Agent, description: 智脑任务、执行确认与运行记录 }
  - { name: Evidence, description: 智脑证据链与审计追踪 }
  - { name: Alerting, description: 告警分级、通知与虚拟电话 }
  - { name: Procurement, description: 采购协同受控动作 }
  - { name: Simulation, description: Mock 场景、连接器故障与系统数据 }
  - { name: Governance, description: 元模型与世界模型治理 }
  - { name: SemanticOperations, description: 独立元域智语任务、证据、巡检、通知与受控报告 }
  - { name: Platform, description: 平台运行状态与配置 }
paths:
  /semantic-operations/models/{modelId}/preview-requests/{requestId}/inspect-prepared:
    post:
      operationId: inspectPreparedPreview
      x-button-permission: meta_model.draft.save
      description: 明确确认原检查点/输入/草稿，当前IAM和实际材料/提案/来源/证据复验，只返回有效性摘要，不续交、签发或执行。POST不重试，不接受路径/身份覆盖。
      parameters:
        - { in: path, name: modelId, required: true, schema: { type: string } }
        - { in: path, name: requestId, required: true, schema: { type: string, format: uuid }, description: 仅小写UUIDv4 }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PreviewRecoveryRequest' } } }
      responses:
        '200': { description: modelId、taskId、checkpointFingerprint、referenceState=valid、contentReturned=false、executionEnabled=false }
        '400': { description: 方法/查询/确认或请求无效 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: 实际引用/检查点/权限/登记变化，不返回正文 }
  /semantic-operations/models/{modelId}/preview-requests/{requestId}/resume:
    post:
      operationId: resumePreparedPreview
      x-button-permission: meta_model.draft.save
      description: 明确确认原检查点与草稿，实际引用/当前IAM复验后联合提交原任务/回执，原ID不变、不重新抽取，证据pending不允许确认或执行。失败不自动重试，可能taskMayHaveCommitted；受管门禁未扩大。
      parameters:
        - { in: path, name: modelId, required: true, schema: { type: string } }
        - { in: path, name: requestId, required: true, schema: { type: string, format: uuid }, description: 仅小写UUIDv4 }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PreviewRecoveryRequest' } } }
      responses:
        '200': { description: 原任务摘要/指纹，resumedFromCheckpoint=true、evidenceState=pending、confirmationEnabled=false、executionEnabled=false }
        '400': { description: 方法/查询/确认或请求无效 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: 引用/检查点/CAS/权限或重复续交拒绝，可能已经提交 }
  /semantic-operations/models/{modelId}/preview-requests/{requestId}/recover-commit:
    post:
      operationId: recoverPreviewCommit
      x-button-permission: meta_model.draft.save
      description: 明确核对原请求/输入/检查点/草稿，读取实际committed回执和任务并复验引用，仅恢复原任务摘要/指纹，不重新提交、补证据或签发。不接受请求号/模型/身份覆盖，POST不自动重试。
      parameters:
        - { in: path, name: modelId, required: true, schema: { type: string } }
        - { in: path, name: requestId, required: true, schema: { type: string, format: uuid }, description: 仅小写UUIDv4 }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PreviewRecoveryRequest' } } }
      responses:
        '200': { description: 原任务摘要/指纹，recoveredCommit=true、原evidenceState、confirmationEnabled=false、executionEnabled=false }
        '400': { description: 方法/查询/确认或请求无效 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: 当前任务/请求/CAS/引用/权限不符，不返回旧内容 }
  /semantic-operations/models/{modelId}/source-materials/inspect:
    post:
      operationId: inspectModelSources
      x-button-permission: meta_model.draft.save
      description: 检查明确来源的当前资料摘要，仅当前实际来源权限，不返回正文、不绑定或访问业务记录；不是提供方调用，POST不自动重试。
      parameters:
        - { in: path, name: modelId, required: true, schema: { type: string, pattern: '^[a-z][a-z0-9-]{1,63}$' } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ModelSourceInspectionRequest' } } }
      responses:
        '200': { description: modelId、revision、systemCodes、sourceFingerprint、documentCount、runtimeReadEnabled=false }
        '400': { description: 非POST或查询覆盖 }
        '409': { description: 载荷、实际IAM/来源/资料/登记无效或变化；默认模型不开放绑定路径 }
  /semantic-operations/models/{modelId}/source-materials/bind:
    post:
      operationId: bindModelSources
      x-button-permission: meta_model.draft.save
      description: 明确确认当前已获准来源的资料绑定，版本与资料SHA双CAS；仅本系统绑定，不授予来源权限、不读业务记录或写上游。不返回正文；失败可能bindingMayHaveCommitted，POST不自动重试，受管运行时门禁不扩大。
      parameters:
        - { in: path, name: modelId, required: true, schema: { type: string, pattern: '^[a-z][a-z0-9-]{1,63}$' } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ModelSourceBindingRequest' } } }
      responses:
        '200': { description: 当前模型绑定的摘要和新revision，不返回资料正文 }
        '400': { description: 非POST或查询覆盖 }
        '409': { description: 未确认、载荷/CAS/来源/权限/登记无效或变化，可能bindingMayHaveCommitted }
  /semantic-operations/models/{modelId}/structured-preview-tasks:
    post:
      operationId: createStructuredPreview
      x-button-permission: meta_model.draft.save
      summary: 从明确绑定的结构化材料生成候选预览
      description: 独立模型、当前IAM与显式来源绑定；稳定请求号及草稿CAS，仅解析可识别Schema，不调用大模型理解/规划/非结构化抽取。不采纳、确认、执行或发布，ready只表示候选证据就绪。POST不自动重试，reserved无检查点不自动接管；受管租户unverified_runtime门禁未扩大。
      parameters:
        - { in: path, name: modelId, required: true, schema: { type: string, pattern: '^[a-z][a-z0-9-]{1,63}$' } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/StructuredPreviewRequest' } } }
      responses:
        '201': { description: 新候选任务摘要、taskFingerprint、evidenceState、traceId及creationMode；executionEnabled=false、runtimeReadEnabled=false }
        '200': { description: 实际回执与引用复验后的同任务复用，reused=true }
        '400': { description: 方法/查询/请求无效或非独立建模诉求 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: IAM/登记/草稿/来源/请求/证据变化或准备仍待处理；可能taskMayHaveCommitted或preparationMayHaveCommitted }
        '422': { description: 缺少可解析的结构化字段，不转入模型生成 }
  /semantic-operations/models/{modelId}/tasks/{taskId}/preview-evidence-recover:
    post:
      operationId: recoverPreviewEvidence
      x-button-permission: meta_model.draft.save
      summary: 明确恢复原结构化候选任务的证据回执
      description: 仅当前所有者/原角色、待确认且未签发的结构化预览任务，新鲜IAM与实际引用复验，确认完整任务指纹。pending恢复记录标注为当前观察，不重建缺失原链，不创建任务、不签发、不执行。POST失败不自动重试；受管租户unverified_runtime门禁不扩大。
      parameters:
        - { in: path, name: modelId, required: true, schema: { type: string, pattern: '^[a-z][a-z0-9-]{1,63}$' } }
        - { in: path, name: taskId, required: true, schema: { type: string, pattern: '^[a-zA-Z0-9][a-zA-Z0-9._-]{0,127}$' } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/LocalTaskConfirmationRequest' } } }
      responses:
        '200': { description: modelId、taskId、evidenceState和traceId，confirmationTokenReturned=false、executionEnabled=false }
        '400': { description: 非POST、查询覆盖、未确认或载荷非法 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: 主体/模型/任务/版本/引用/原证据不符，可能taskMayHaveCommitted或evidencePending；不返回凭证 }
  /semantic-operations/models/{modelId}/preview-requests/{requestId}:
    get:
      operationId: getPreviewRequestStatus
      summary: 只读查询当前主体的结构化预览请求状态
      x-button-permission: meta_model.draft.save
      description: 需要新鲜管理层IAM、语义运营页面及草稿权限和模型登记。仅当前主体/原角色的状态与摘要，prepared/committed复验实际记录；无快照reserved阻塞，不自动重试、接管、准备或执行，不接受查询覆盖参数。商业受管租户仍受unverified_runtime门禁，状态不代表恢复或引用准入。
      parameters:
        - { in: path, name: modelId, required: true, schema: { type: string, pattern: '^[a-z][a-z0-9-]{1,63}$' } }
        - { in: path, name: requestId, required: true, schema: { type: string, pattern: '^[a-f0-9]{8}-[a-f0-9]{4}-4[a-f0-9]{3}-[89ab][a-f0-9]{3}-[a-f0-9]{12}$' } }
      responses:
        '200':
          description: 请求元数据，不返回准备正文或凭证
          content: { application/json: { schema: { $ref: '#/components/schemas/PreviewRequestStatus' } } }
        '400': { description: 非法请求号、查询参数或写方法 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: 当前模型或主体的请求不存在，不分配占位 }
        '409': { description: 当前登记/IAM失效、实际回执或检查点变化，不返回旧摘要 }
  /semantic-operations/models/{modelId}/tasks:
    get:
      operationId: listScopedSemanticModelTaskMetadata
      summary: 分页读取指定模型的当前可见任务摘要
      description: 需当前管理层及语义运营页面权限；沿用任务所有者、同租户、审核指派及任务自身权限校验。仅任务元数据，不返回用户标题、请求/回复、消息、材料、提案全文或证据。无创建、确认、执行入口，不接受其他查询或模型/租户头选择。
      parameters:
        - { in: path, name: modelId, required: true, schema: { type: string, pattern: '^[a-z][a-z0-9-]{1,63}$' } }
        - { in: query, name: offset, schema: { type: integer, minimum: 0, maximum: 1000000, default: 0 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
        - { in: query, name: includeArchived, schema: { type: boolean, default: false } }
      responses:
        '200': { description: 当前权限范围tasks、offset、limit、modelId；contentScope=task_metadata_only、runtimeReadEnabled=false，不返回总量 }
        '400': { description: 非法或重复分页参数、其他选择字段或写方法 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: 当前租户未登记模型 }
        '409': { description: 等待期间IAM或模型登记失效，不返回任务摘要 }
  /semantic-operations/models/{modelId}/tasks/{taskId}:
    get:
      operationId: getScopedSemanticModelTaskMetadata
      summary: 读取指定模型内当前可见任务摘要
      description: 管理层及语义运营页面权限不能替代任务权限。未知、跨模型、他人且无审核访问或任务权限已撤销均404；默认工作区不接收非默认模型任务引用。只返回泛化标题、状态、时间、所需权限、确认标记及可选提案编号/修订/状态，不返回对话或提案全文，不创建授权。
      parameters:
        - { in: path, name: modelId, required: true, schema: { type: string, pattern: '^[a-z][a-z0-9-]{1,63}$' } }
        - { in: path, name: taskId, required: true, schema: { type: string, pattern: '^[a-zA-Z0-9][a-zA-Z0-9._-]{0,127}$' } }
      responses:
        '200': { description: task摘要、modelId；contentScope=task_metadata_only、runtimeReadEnabled=false }
        '400': { description: 不接受查询参数或写方法 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: 模型或任务不存在，或当前任务访问不被允许 }
        '409': { description: 等待期间IAM或模型登记失效 }
  /semantic-operations/models/{modelId}/tasks/{taskId}/dialogue:
    get:
      operationId: getSemanticModelTaskDialogue
      description: 仅任务所有者的限定对话读取；新鲜IAM、登记及任务/提案/材料/来源/交接/ready证据引用复验。审核权限不开放作者对话。不返回附件、来源发现、提案全文、凭证或证据正文。不创建、确认、执行或发布。
      parameters:
        - { in: path, name: modelId, required: true, schema: { type: string, pattern: '^[a-z][a-z0-9-]{1,63}$' } }
        - { in: path, name: taskId, required: true, schema: { type: string, pattern: '^[a-zA-Z0-9][a-zA-Z0-9._-]{0,127}$' } }
      responses:
        '200': { description: task摘要及messages（仅user/assistant角色、content和可选time），evidenceState；最多64条、每条8192字符、合计128KiB。contentScope=owner_dialogue_only，executionEnabled=false，runtimeReadEnabled=false }
        '400': { description: 不接受查询参数或写方法 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: 当前身份不可访问任务 }
        '409': { description: IAM、模型登记或引用变化，拒绝返回对话 }
        '413': { description: 对话超预算或格式不支持；不静默截断 }
  /semantic-operations/models/{modelId}/local-validation-tasks:
    post:
      operationId: createLocalValidationTask
      description: 仅本地结构校验任务；稳定请求号/草稿CAS，明确创建，不自动确认或执行，不调用大模型或源系统。满200条记录拒绝，不淘汰历史。
      parameters:
        - { in: path, name: modelId, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/LocalValidationTaskRequest' } } }
      responses:
        '201': { description: 创建待确认任务，返回任务摘要、taskFingerprint、taskId及证据状态 }
        '200': { description: 同请求复用原任务，不自动执行 }
        '400': { description: 方法、查询或请求载荷无效 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: 草稿/任务/权限/证据变化；保留taskMayHaveCommitted与evidencePending，不自动重试 }
  /semantic-operations/models/{modelId}/tasks/{taskId}/adoption-review:
    get:
      operationId: reviewAdoptionTask
      x-button-permission: meta_model.draft.save
      x-review-permission: meta_model.draft.review
      description: 当前所有者的结构化候选、真实来源及任务证据/提案/草稿版本复验，返回限定对象字段关系图、结构差异与校验状态；无样本正文/凭证，不授予执行权限。拒绝POST或查询覆盖。
      parameters:
        - { in: path, name: modelId, required: true, schema: { type: string } }
        - { in: path, name: taskId, required: true, schema: { type: string } }
      responses:
        '200': { description: owned_candidate_structure_only图/差异及原任务和草稿指纹，executionEnabled/runtimeReadEnabled=false }
        '400': { description: 非法方法或查询 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: 当前权限/版本/引用不可用 }
        '413': { description: 结构无效或超限，不静默截断 }
  /semantic-operations/models/{modelId}/tasks/{taskId}/adoption-confirm:
    post:
      operationId: confirmAdoptionTask
      x-button-permission: meta_model.draft.save
      x-review-permission: meta_model.draft.review
      description: 仅所有者provider=none结构化预览apply_proposal；复验实际保存及审核权限、任务版本、引用、Critic和样本后签发一次性凭证，不执行。禁止GET及查询覆盖。
      parameters:
        - { in: path, name: modelId, required: true, schema: { type: string } }
        - { in: path, name: taskId, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/LocalTaskConfirmationRequest' } } }
      responses:
        '200': { description: 确认证据ready、一次性凭证及taskFingerprint，不执行 }
        '400': { description: 非法方法、查询或载荷 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: 版本/证据/映射拒绝；失败可能已签发或有待恢复证据 }
  /semantic-operations/models/{modelId}/tasks/{taskId}/adoption-execute:
    post:
      operationId: executeAdoptionTask
      x-button-permission: meta_model.draft.save
      x-review-permission: meta_model.draft.review
      description: 明确执行当前所有者结构化候选采纳，任务CAS、原草稿版本及一次性凭证；重查权限/引用，只写本系统草稿并保存快照，不调用提供方、模拟、发布或写上游。POST不自动重试。
      parameters:
        - { in: path, name: modelId, required: true, schema: { type: string } }
        - { in: path, name: taskId, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/LocalTaskExecutionRequest' } } }
      responses:
        '200': { description: 原任务摘要及executedCommand=apply_proposal，不返回正文或凭证 }
        '400': { description: 非法方法、查询或载荷 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: 拒绝/失败，可能已消费凭证或写入草稿；不自动重试 }
  /semantic-operations/models/{modelId}/tasks/{taskId}/adoption-confirmation-evidence-recover:
    post:
      operationId: recoverAdoptionConfirmationEvidence
      x-button-permission: meta_model.draft.save
      x-review-permission: meta_model.draft.review
      description: 明确核验当前所有者结构化候选的既有确认证据；不重新签发，不返回遗失凭证，不执行。
      parameters:
        - { in: path, name: modelId, required: true, schema: { type: string } }
        - { in: path, name: taskId, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false, required: [confirmed], properties: { confirmed: { type: boolean, const: true } } } } }
      responses:
        '200': { description: 证据状态摘要，confirmationTokenReturned=false、executionEnabled=false }
        '400': { description: 非法方法、查询或载荷 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: 证据/引用/类型拒绝，不重建历史 }
  /semantic-operations/models/{modelId}/tasks/{taskId}/local-confirm:
    post:
      operationId: confirmLocalValidationTask
      description: 仅所有者的validate_model任务；明确确认、完整任务CAS、整链复验，证据完成后返回一次性凭证和新的taskFingerprint。不执行。
      parameters:
        - { in: path, name: modelId, required: true, schema: { type: string } }
        - { in: path, name: taskId, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/LocalTaskConfirmationRequest' } } }
      responses:
        '200': { description: 确认证据ready后返回confirmationToken、expiresAt及新taskFingerprint；executionEnabled=false }
        '400': { description: 方法、查询或请求无效 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: CAS、权限、类型或证据失败；不返回凭证，可能已经签发 }
  /semantic-operations/models/{modelId}/tasks/{taskId}/local-execute:
    post:
      operationId: executeLocalValidationTask
      description: 只执行本地validate_model，不开放建模采纳、Python模拟、发布或源系统写入；明确执行、完整任务CAS、一次性凭证，前后IAM及引用复验。不重试POST。
      parameters:
        - { in: path, name: modelId, required: true, schema: { type: string } }
        - { in: path, name: taskId, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/LocalTaskExecutionRequest' } } }
      responses:
        '200': { description: 任务摘要及校验状态；不返回正文、凭证或租约 }
        '400': { description: 方法、查询或请求无效 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: 执行拒绝/失败，可能已消费凭证或本地写入；保留taskMayHaveCommitted/workspaceWriteMayHaveCommitted }
  /semantic-operations/models/{modelId}/tasks/{taskId}/confirmation-evidence-recover:
    post:
      operationId: recoverLocalConfirmationEvidence
      description: 明确恢复当前所有者validate_model任务的既有确认证据；不重签、执行或返回遗失凭证。
      parameters:
        - { in: path, name: modelId, required: true, schema: { type: string } }
        - { in: path, name: taskId, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false, required: [confirmed], properties: { confirmed: { type: boolean, const: true } } } } }
      responses:
        '200': { description: confirmationEvidenceState=ready、confirmationTokenReturned=false、executionEnabled=false }
        '400': { description: 请求无效 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: 权限或引用失效，或证据仍未完成 }
  /semantic-operations/models:
    get:
      operationId: listSemanticModelWorkspaces
      summary: 读取当前租户已登记的模型工作区
      description: 服务端身份绑定租户；需管理层角色及语义运营页面权限。只返回注册元数据，不启用业务读取，不接受查询参数或客户端租户选择。
      responses:
        '200': { description: revision、models和runtimeSelectionEnabled=false }
        '400': { description: 不允许的查询或请求 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: 等待期间权限变更或仓储不可用，不返回模型元数据 }
    post:
      operationId: registerSemanticModelWorkspace
      summary: 按当前注册修订登记独立模型
      x-button-permission: meta_model.draft.save
      description: 需管理层角色、语义运营页面及保存权限；注册不复制草稿、不发布、不授予来源访问。注册与IAM不是跨仓储原子事务；409带registrationMayHaveCommitted=true时需重新授权后只读核验，不能自动重发。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [id, label, expectedRevision]
              properties:
                id: { type: string, pattern: '^[a-z][a-z0-9-]{1,63}$', description: 不允许默认模型oa-governance }
                label: { type: string, minLength: 2, maxLength: 80 }
                description: { type: string, maxLength: 1000 }
                expectedRevision: { type: integer, minimum: 0 }
      responses:
        '201': { description: 新revision、model和runtimeSelectionEnabled=false；runtimeBinding=not_bound }
        '400': { description: 不合法字段或客户端身份选择 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: 修订冲突、重复、容量限制或权限/存储变化；可能含registrationMayHaveCommitted=true }
  /semantic-operations/models/{modelId}/draft:
    parameters:
      - { in: path, name: modelId, required: true, schema: { type: string, pattern: '^[a-z][a-z0-9-]{1,63}$' } }
    get:
      operationId: getScopedSemanticModelDraft
      summary: 读取当前租户已登记模型的草稿结构
      description: 需管理层及语义运营页面权限，等待后复验IAM及模型登记。返回草稿结构，不读取上游数据，不持久化模型选择。
      responses:
        '200': { description: modelId、draft（含fingerprint）、selectionScope=request_only、runtimeReadEnabled=false }
        '400': { description: 不接受查询选择 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: 当前租户未登记该模型 }
        '409': { description: 权限、模型登记或仓储变化 }
    post:
      operationId: saveScopedSemanticModelDraft
      summary: 明确确认并按结构指纹CAS保存指定模型草稿及快照
      x-button-permission: meta_model.draft.save
      description: 需管理层、语义运营页面及保存权限。input为限定结构补丁，省略字段保留；不接受modelId/tenantId、worldModel或任意额外顶层字段。事务内比对结构指纹，结构变更时草稿及快照原子保存；不审批、发布或操作上游系统。写入后409带workspaceWriteMayHaveCommitted=true时需只读核验，不能自动重发。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirmed, expectedFingerprint, input]
              properties:
                confirmed: { const: true }
                expectedFingerprint: { type: string, pattern: '^[a-f0-9]{24}$' }
                input:
                  type: object
                  additionalProperties: false
                  minProperties: 1
                  properties:
                    modelingProfile: { type: string }
                    scenario: { type: object }
                    stateMachines: { type: array, maxItems: 30, items: { type: object } }
                    events: { type: array, maxItems: 100, items: { type: object } }
                    objectTypes: { type: array, minItems: 1, maxItems: 40, items: { type: object } }
                    relationshipTypes: { type: array, maxItems: 40, items: { type: object } }
                    policies: { type: array, maxItems: 12, items: { type: string, minLength: 1, maxLength: 2000 } }
                    metrics: { type: array, maxItems: 50, items: { type: object } }
                    glossaryTerms: { type: array, maxItems: 100, items: { type: object } }
                    dataContracts: { type: array, maxItems: 50, items: { type: object } }
                    qualityRules: { type: array, maxItems: 100, items: { type: object } }
                    accessPolicies: { type: array, maxItems: 100, items: { type: object } }
                    lineageEdges: { type: array, maxItems: 100, items: { type: object } }
      responses:
        '200': { description: 保存结果及可选snapshot；不代表业务校验、审批或发布成功 }
        '400': { description: 未明确确认、非法补丁或输入超限 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: 当前租户未登记该模型 }
        '409': { description: 草稿结构指纹冲突、权限/存储变化；可能含workspaceWriteMayHaveCommitted=true }
  /semantic-operations/models/{modelId}/validate:
    post:
      operationId: validateScopedSemanticModelDraft
      summary: 按草稿结构指纹校验指定模型
      x-button-permission: meta_model.draft.validate
      description: 需当前管理层及语义运营页面/校验权限；明确确认且事务内核对结构指纹。返回检查名称/状态，不返回材料、审计或检查正文。校验failed仍返回200，不代表可发布；不调用外部服务。
      parameters:
        - { in: path, name: modelId, required: true, schema: { type: string, pattern: '^[a-z][a-z0-9-]{1,63}$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScopedModelAnalysisRequest' }
      responses:
        '200': { description: validation状态/检查摘要、modelId和sourceFingerprint；runtimeReadEnabled=false }
        '400': { description: 非法请求、查询参数或确认缺失 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: 当前租户未登记模型 }
        '409': { description: 指纹冲突、权限或仓储变化；可能含workspaceWriteMayHaveCommitted=true }
  /semantic-operations/models/{modelId}/simulate:
    post:
      operationId: simulateScopedSemanticModelDraft
      summary: 按草稿结构指纹生成指定模型的本地合成模拟
      x-button-permission: meta_model.simulate
      description: 需当前管理层及语义运营页面/模拟权限；明确确认且事务内核对结构指纹。仅内置本地结构/合成回放，返回数量与状态，不返回实例原文、判断回放正文或完整模型。不调用Python、上游或大模型，不发布、不证明真实业务可用。
      parameters:
        - { in: path, name: modelId, required: true, schema: { type: string, pattern: '^[a-z][a-z0-9-]{1,63}$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScopedModelAnalysisRequest' }
      responses:
        '200': { description: simulation合成状态/检查/数量、modelId及sourceFingerprint；verifiesLiveSystems=false、runtimeReadEnabled=false }
        '400': { description: 非法请求、查询参数或确认缺失 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: 当前租户未登记模型 }
        '409': { description: 指纹冲突、权限或仓储变化；可能含workspaceWriteMayHaveCommitted=true }
        '422': { description: 校验未通过，未保存新的模拟成功状态 }
  /semantic-operations/models/{modelId}/publish:
    post:
      operationId: publishLocalSemanticModelWorkspace
      summary: 明确确认后发布指定模型至固定认证本机实例
      x-button-permission: meta_model.publish
      description: 需当前管理层、语义运营页面和发布权限；仅服务端已启用的认证回环实例。载荷不能指定租户、角色、地址、凭据、版本或授权。发送前和登记前复验IAM、模型登记、确认指纹、执行锁及实例配置。未知结果只查询原版本，不重发；远端副作用不能因本地拒绝而自动撤回。仅定义发布，runtimeReadEnabled=false，不启用业务读取；禁止GET和查询参数，SDK POST不自动重试。
      parameters:
        - { in: path, name: modelId, required: true, schema: { type: string, pattern: '^[a-z][a-z0-9-]{1,63}$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScopedModelAnalysisRequest' }
      responses:
        '200': { description: modelId、publication状态/版本/指纹；projectionScope=definition_only，runtimeReadEnabled=false；无模型全文、实例地址或凭据 }
        '400': { description: 非法载荷、查询、缺少确认或默认工作区 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: 当前租户未登记模型（配置有效时） }
        '409': { description: 本机目标未配置、指纹/权限/执行状态冲突或结果不确定；publicationMayHaveCommitted=true表示需核验，不能自动重发 }
  /semantic-operations/models/{modelId}/simulation:
    get:
      operationId: getScopedSemanticModelSimulation
      summary: 读取指定模型保存的合成模拟摘要
      description: 需当前管理层及语义运营页面权限；未模拟或保存新草稿后simulation=null。不触发构建，不启用业务读取；不接受查询参数。
      parameters:
        - { in: path, name: modelId, required: true, schema: { type: string, pattern: '^[a-z][a-z0-9-]{1,63}$' } }
      responses:
        '200': { description: modelId、simulation摘要或null；runtimeReadEnabled=false }
        '400': { description: 非法请求或查询参数 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: 当前租户未登记模型 }
        '409': { description: 权限、模型登记或仓储变化 }
  /semantic-operations/models/{modelId}/workspace:
    get:
      operationId: inspectSemanticModelWorkspace
      summary: 请求范围内读取指定已登记模型的工作区摘要
      description: 需管理层角色及语义运营页面权限；只返回草稿数量/指纹、模拟状态及发布摘要。selectionScope=request_only；不持久化选择、不改变共享路由、不返回材料原文、不启用智脑业务读取。
      parameters:
        - { in: path, name: modelId, required: true, schema: { type: string, pattern: '^[a-z][a-z0-9-]{1,63}$' } }
      responses:
        '200': { description: 模型摘要、可用inspect_workspace及仍禁用的操作列表 }
        '400': { description: 不允许的查询参数 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: 当前租户未登记该模型 }
        '409': { description: 权限、登记状态或仓储变化，不返回摘要 }
  /semantic-operations/knowledge-library/material-reviews/reviewers:
    get:
      operationId: listMaterialReviewers
      summary: 本租户当前有效的资料审核人员
      description: 需当前页面、审核与保存权限；仅返回姓名和主体编号，不回退演示租户。
      responses:
        '200': { description: reviewers列表；候选资格不授予来源读取权限 }
        '403': { $ref: '#/components/responses/Forbidden' }
  /semantic-operations/knowledge-library/material-reviews/{id}/assignment:
    post:
      operationId: assignMaterialReviewer
      summary: 提交人或当前承办人显式指派、转派或退回审核池
      description: 当前有效审核人员、独立来源复验、职责分离与CAS；记录、泛化站内通知和事件原子保存，不向外部平台发消息。
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirmed, expectedRevision, subjectId]
              properties:
                confirmed: { const: true }
                expectedRevision: { type: integer, minimum: 1 }
                subjectId: { type: [string, 'null'], maxLength: 128 }
      responses:
        '200': { description: 新修订及指派结果；不授予读取权限 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: 修订、待审核状态或来源冲突 }
  /semantic-operations/knowledge-library/material-reviews/history:
    get:
      operationId: listArchivedMaterialReviews
      summary: 分页读取保留归档资料核对记录
      description: 每窗口10条，逐读取者复验来源，来源无权或变化则省略，不返回原文缓存；归档不恢复来源或待审核状态。
      parameters:
        - { in: query, name: offset, schema: { type: integer, minimum: 0, maximum: 1000, default: 0 } }
      responses:
        '200': { description: 当前可读reviews、offset、hasMore }
        '403': { $ref: '#/components/responses/Forbidden' }
  /semantic-operations/knowledge-library/material-reviews/{id}/archive:
    post:
      operationId: archiveMaterialReview
      summary: 原提交人保留归档终态记录并释放日常预算
      description: 同时需要审核、保存及页面权限。事务转移记录与出箱事件，不删除；待审核不能归档，最多1000条保留归档，满额拒绝。来源已失效仍允许本人进行保留归档。
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirmed, expectedRevision]
              properties:
                confirmed: { const: true }
                expectedRevision: { type: integer, minimum: 1 }
      responses:
        '200': { description: archived、retained及新revision }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: 当前主体无可归档记录 }
        '409': { description: 修订变化或非终态 }
        '413': { description: 1000条保留归档已满 }
  /semantic-operations/knowledge-library/material-reviews:
    get:
      operationId: listSharedMaterialReviews
      summary: 按当前人员独立来源授权列出资料协作核对
      description: 需语义端页面和草稿审核权限。每窗口最多10项，无权或来源失效的记录连标题也不返回；不返回全库数量。
      parameters:
        - { in: query, name: offset, schema: { type: integer, minimum: 0, maximum: 100, default: 0 } }
      responses:
        '200': { description: reviews、offset、hasMore、windowSize }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: submitSharedMaterialReview
      summary: 显式提交最多3项授权企业资料供独立审核
      description: 同时需要当前页面、审核及保存权限；仅WeKnora来源指针，个人知识库不允许共享。最多100条保留记录，不复制原文，不授予读取权限或发布规则。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirmed, citations]
              properties:
                confirmed: { const: true }
                citations:
                  type: array
                  minItems: 1
                  maxItems: 3
                  items:
                    type: object
                    additionalProperties: false
                    required: [provider, knowledgeBaseId, documentId, chunkId, revision, location]
                    properties:
                      provider: { const: weknora_local }
                      knowledgeBaseId: { type: string, maxLength: 100 }
                      documentId: { type: string, maxLength: 100 }
                      chunkId: { type: string, maxLength: 100 }
                      revision: { type: string, pattern: '^[a-f0-9]{64}$' }
                      location: { const: provider_chunk_not_pdf_coordinates }
      responses:
        '200': { description: 未发布且不授权的review摘要 }
        '400': { description: 输入无效或来源不是允许的企业指针 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: 来源变化或已有待核对记录 }
        '413': { description: 证据或记录预算超限 }
  /semantic-operations/knowledge-library/material-reviews/{id}:
    get:
      operationId: readSharedMaterialReview
      summary: 独立复验来源并读取审核资料原文
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: review及当前允许读取的sources，不缓存原文 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: 当前租户无此记录 }
        '409': { description: 来源版本或审核修订变化 }
  /semantic-operations/knowledge-library/material-reviews/{id}/decision:
    post:
      operationId: decideSharedMaterialReview
      summary: 非提交人核对通过或退回，提交人撤回待核对记录
      description: 需当前页面、审核及保存权限；按修订号提交。通过不是规则发布、上游权限授予或业务执行。来源不可读后本人仍可撤回待核对记录。
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirmed, expectedRevision, decision]
              properties:
                confirmed: { const: true }
                expectedRevision: { type: integer, minimum: 1 }
                decision: { enum: [approved, rejected, withdrawn] }
                note: { type: string, maxLength: 1000, description: 人工核对意见，可选；按当前来源授权读取，不复制到事件或变成模型指令 }
      responses:
        '200': { description: 新修订和状态，published与grantsAuthority恒为false }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: 非待审核状态、修订冲突或来源失效 }
  /semantic-operations/reviewers:
    get:
      operationId: listSemanticModelReviewers
      summary: 获取本租户当前有效的模型审核人员（仅姓名与主体编号）
      description: 必须具备语义端页面、草稿保存及模型审核权限；从当前租户IAM解析，不回退演示人员。
      responses:
        '200':
          description: reviewers列表及当前actorSubjectId，不含账号、联系方式或授权明细。
        '403':
          description: 无当前审核权限或租户上下文不一致。
  /semantic-operations/knowledge-library/team-model-views/history:
    get:
      operationId: listTeamOntologyViewHistory
      summary: 分页读取已撤回与归档团队视图元信息
      description: 仅同租户当前审核权限人员可读，不返回布局、个人视图编号或主体键。
      parameters:
        - { in: query, name: offset, schema: { type: integer, minimum: 0, maximum: 1100, default: 0 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200': { description: views、total、offset、limit }
        '400': { description: 分页输入无效 }
        '403': { $ref: '#/components/responses/Forbidden' }
  /semantic-operations/knowledge-library/team-model-views/{id}/archive:
    post:
      operationId: archiveTeamOntologyView
      summary: 原分享人归档已撤回的团队布局
      description: 需当前审核与草稿保存权限，按修订号在事务中转移到归档区，保留历史而非删除，释放日常100条记录预算。归档区最多1000条，不能恢复已撤回布局。
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedRevision]
              properties:
                expectedRevision: { type: integer, minimum: 1 }
      responses:
        '200': { description: archived、revision与retained标记 }
        '400': { description: 参数无效 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: 无本人未归档视图 }
        '409': { description: 修订冲突或尚未撤回 }
        '413': { description: 归档预算超限 }
  /semantic-operations/tasks/{id}/review-assignment:
    post:
      operationId: assignSemanticModelReview
      summary: 指派、转派或退回语义模型审核池
      description: 仅待确认模型任务可操作。首次由有权限审核人指派；后续由承办人或有审核权限的创建人操作。事务更新指派和定向提醒，作废旧确认凭证，不采纳或发布，不授予权限。
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [subjectId, expectedRevision]
              properties:
                subjectId: { type: [string, 'null'], maxLength: 128, description: 当前有效IAM主体编号；null明确退回审核池 }
                expectedRevision: { type: integer, minimum: 0 }
      responses:
        '200':
          description: 新assignment修订与confirmationInvalidated标记。
        '400':
          description: 非法输入。
        '403':
          description: 操作人或目标无当前权限。
        '404':
          description: 无本租户模型任务。
        '409':
          description: 修订、任务状态冲突或重复指派。
  /integrations/workflows/webhooks/{providerId}:
    post:
      tags: [SemanticOperations]
      operationId: receiveWorkflowChangeNotification
      security: []
      description: 服务端流程变更通知入口。签名仅把通知作为重新拉取信号；不采信回调正文为业务事实。提供方、租户和签名密钥由部署配置绑定。
      parameters:
        - { name: providerId, in: path, required: true, schema: { type: string, pattern: '^[a-z][a-z0-9_-]{1,48}$' } }
        - { name: x-workflow-event-id, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 180 } }
        - { name: x-workflow-timestamp, in: header, required: true, schema: { type: string, pattern: '^\d{10}$' } }
        - { name: x-workflow-signature, in: header, required: true, schema: { type: string, pattern: '^sha256=[a-f0-9]{64}$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [eventType]
              properties:
                eventType: { type: string, enum: [definition.changed, instance.changed, instance.completed, reconciliation.requested] }
                resourceRef: { type: string, maxLength: 240, description: 只保存哈希，不作为业务事实 }
      responses:
        '202': { description: 已验证签名并按配置租户入队 }
        '200': { description: 重复事件已幂等接收 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: 未配置提供方 }
        '503': { description: 签名密钥不可用或收件箱已满 }
  /semantic-operations/workflows:
    get:
      tags: [SemanticOperations]
      operationId: getWorkflowIntegrationOverview
      description: 读取当前租户的流程目录、具体流程类别、参与系统、跨系统数量、实时/定时/手动同步策略和同步记录；候选版本不等于已发布。
      responses:
        '200': { description: 流程目录、指标、提供方与同步记录 }
        '403': { $ref: '#/components/responses/Forbidden' }
  /semantic-operations/workflows/sync:
    post:
      tags: [SemanticOperations]
      operationId: syncWorkflowDefinitions
      description: 需meta_model.draft.save。运营人员手动立即同步 Mock 或已配置真实连接器；发现新定义或版本并生成候选，不自动发布给智脑。Webhook 实时触发与 Worker 定时对账使用同一同步内核。
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                scenario: { type: string, enum: [baseline, changed], default: baseline }
                mode: { type: string, enum: [configured], description: 使用服务端配置的真实连接器；与scenario二选一 }
      responses:
        '200': { description: 幂等同步结果 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { description: 真实连接器或服务端凭据尚未配置 }
  /semantic-operations/workflows/{code}:
    get:
      tags: [SemanticOperations]
      operationId: getWorkflowDefinition
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 最新定义、流程类别、参与系统、跨系统交接、版本历史、流程图和运行实例 }
        '404': { description: 流程不可见或不存在 }
  /semantic-operations/workflows/{code}/versions/{version}/review:
    post:
      tags: [SemanticOperations]
      operationId: reviewWorkflowVersion
      description: 需meta_model.publish。明确发布或拒绝候选版本；同步权限不能替代该权限。
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action]
              properties:
                action: { type: string, enum: [publish, reject] }
      responses:
        '200': { description: 校对后的版本与当前生效版本 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: 目标不是候选版本 }
  /semantic-operations/workflows/events/{eventId}/replay:
    post:
      tags: [SemanticOperations]
      operationId: replayWorkflowDeadLetterEvent
      description: 需event.outbox.replay。只把当前租户的流程通知死信重新入队，不直接写流程事实。
      parameters:
        - { name: eventId, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 240 } }
      responses:
        '200': { description: 死信已重新入队 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: 当前租户不存在该事件 }
        '409': { description: 事件不是死信状态 }
  /agent/workflow-context:
    get:
      tags: [Agent]
      operationId: queryPublishedWorkflowContext
      description: 只读查询已发布流程、具体流程类别、跨系统链路、运行实例和有界流转记录。管理流程按主体隐藏个人数据，业务流程按角色和业务域裁剪申请人、金额、意见及参与人；不执行审批动作。
      parameters:
        - { name: query, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 240 } }
      responses:
        '200': { description: 带来源版本和观测时间的流程上下文 }
        '400': { description: 查询为空 }
        '403': { $ref: '#/components/responses/Forbidden' }
  /agent/anomalies:
    get:
      tags: [Agent]
      operationId: listAnomalyReports
      description: 当前企业、主体及原始角色的个人汇报记录；需page.agent.view。不是钉钉群共享收件箱。
      responses:
        '200': { description: reports、fields、policy及未接入能力；integration为not_connected }
        '403': { description: 当前主体没有访问权限 }
    post:
      tags: [Agent]
      operationId: createAnomalyReport
      description: 需agent.prompt.run。只记录人工或模拟来源，不信任客户端传入的钉钉身份。同requestId同内容幂等；不会自动调用字段提取模型或写ERP。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [requestId, expectedRevision, source]
              properties:
                requestId: { type: string, minLength: 1, maxLength: 100 }
                expectedRevision: { type: integer, const: 0 }
                source: { $ref: '#/components/schemas/AnomalySource' }
      responses:
        '200': { description: 草稿及来源，execution为none }
        '400': { description: 来源格式错误或材料安全检查拒绝 }
        '403': { description: 权限不足 }
        '409': { description: 同消息键内容冲突或缺少附件解析确认 }
        '413': { description: 材料或个人工作区超限 }
        '422': { description: 附件未能解析，未创建假观察 }
  /agent/anomalies/{id}/{action}:
    post:
      tags: [Agent]
      operationId: changeAnomalyReport
      description: 需page.agent.view及agent.prompt.run。所有动作必须提供当前expectedRevision。extract还需精确模型consent，输出字段、带引文的AI理解/分析和问题；edit/retract需reason；ask生成本站提报人确认请求及未发送的@预览；reply需reviewId/text，仅本站原提报人可回复；confirm需reviewId及confirmed=true。reply、补充、更正或AI解读使旧确认失效；回复后必须重新整理再ask。没有真实群发送或下游执行。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, maxLength: 100 } }
        - { name: action, in: path, required: true, schema: { type: string, enum: [append, edit, extract, ask, reply, confirm, retract] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedRevision]
              properties:
                expectedRevision: { type: integer, minimum: 1 }
                source: { $ref: '#/components/schemas/AnomalySource' }
                fields:
                  type: object
                  additionalProperties: false
                  properties:
                    location: { type: [string, 'null'], maxLength: 300 }
                    equipment: { type: [string, 'null'], maxLength: 300 }
                    batch: { type: [string, 'null'], maxLength: 300 }
                    phenomenon: { type: [string, 'null'], maxLength: 300 }
                    quantity: { type: [string, 'null'], maxLength: 300 }
                    occurredAt: { type: [string, 'null'], maxLength: 300 }
                    reportedAction: { type: [string, 'null'], maxLength: 300 }
                reason: { type: string, minLength: 1, maxLength: 500 }
                reviewId: { type: string, minLength: 1, maxLength: 100 }
                text: { type: string, minLength: 1, maxLength: 3000 }
                confirmed: { type: boolean, const: true }
                consent:
                  type: object
                  additionalProperties: false
                  required: [provider, model, confirmed]
                  properties:
                    provider: { type: string }
                    model: { type: string }
                    confirmed: { type: boolean, const: true }
      responses:
        '200': { description: 新版本的个人异常记录；无下游执行 }
        '400': { description: 无效字段、缺少原因或包含当前动作不接受的字段 }
        '403': { description: 权限不足或模型用途未开放 }
        '404': { description: 当前范围没有此记录 }
        '409': { description: 版本/模型/确认冲突或记录已撤回 }
        '413': { description: 版本或容量超限 }
        '422': { description: 确认缺少地点/异常现象或附件不可读 }
        '502': { description: 模型字段或来源引用非法 }
        '503': { description: 模型未成功返回；diagnostics仅含固定阶段及可选HTTP状态，不含上游正文 }
  /agent/knowledge-library/answer-sources:
    post:
      tags: [Agent]
      operationId: supplementAgentKnowledgeSources
      description: 明确确认后在已选文档内每个提供方补查一次，最多五条原文；不调用回答模型，预览后需重新确认出网。
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/KnowledgeSupplementInput' } } }
      responses:
        '200': { description: 当前来源预览，modelCalled=false、consentRequired=true }
        '400': { description: 输入或确认无效 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: 来源发生变化，不返回部分结果 }
  /semantic-operations/knowledge-library/answer-sources:
    post:
      tags: [SemanticOperations]
      operationId: supplementSemanticKnowledgeSources
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/KnowledgeSupplementInput' } } }
      responses:
        '200': { description: 运营身份选定文档的补查预览，不调用回答模型 }
        '400': { description: 输入或确认无效 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: 来源变化 }
  /semantic-operations/knowledge-library/read-plan-proposal:
    post:
      tags: [SemanticOperations]
      operationId: proposeSemanticReadPlan
      description: 仅运营端；保存草稿指纹、页面和编辑权限复验，明确允许发送结构/规则后生成受约束表达式。服务器只沿声明外键编译关联目录，剪除未依赖数据集。仅候选，不保存、查询业务或发布；后续人工采用、校验、正反例回放与发布独立执行。
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReadPlanProposalInput' } } }
      responses:
        '200': { description: pending_human_review，只保证结构与字段引用校验，不保证公式符合业务 }
        '400': { description: 输入或根对象无效 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: 草稿、权限、模型或确认变化；READ_PLAN_JOIN_SELECTION_REQUIRED携带joinChoices，要求人工选择关联后重新确认，不返回方案 }
        '422': { description: READ_PLAN_NEEDS_CLARIFICATION携带reason和questions；待核实缺口，不自动保存或重试 }
        '502': { description: 提案无法通过校验，不保存为成功 }
  /semantic-operations/knowledge-library/model-links:
    get:
      tags: [SemanticOperations]
      operationId: listSemanticKnowledgeModelLinks
      description: 当前租户、主体、角色的资料依据图；复验模型及来源，失效记录不返回摘录。不是团队共享授权。
      responses:
        '200': { description: 关联记录、当前模型指纹与对象/关系目标目录 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: 同次读取期间模型或证据发生变化 }
    post:
      tags: [SemanticOperations]
      operationId: saveSemanticKnowledgeModelLink
      description: 要求草稿保存权限及人工确认。关联绑定当前模型指纹与复验引用，不改变模型或发布。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [objectId, modelFingerprint, relationType, citation, confirmed]
              properties:
                objectId: { type: string, maxLength: 256, description: 对象编码，或服务器目标目录中的关系标识 }
                modelFingerprint: { type: string, pattern: '^[a-f0-9]{24}$' }
                relationType: { type: string, enum: [definition, rule, field, workflow] }
                citation: { $ref: '#/components/schemas/KnowledgeCitation' }
                confirmed: { type: boolean, const: true }
      responses:
        '200': { description: 保存结果，重复确认幂等 }
        '400': { description: 输入或引用无效 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: 模型、证据或权限发生变化 }
        '413': { description: 关联记录超过256条 }
  /semantic-operations/knowledge-library/model-links/suggest:
    post:
      tags: [SemanticOperations]
      operationId: suggestSemanticKnowledgeModelLinks
      description: 默认对选定引用做名称匹配；model模式须管理员允许及匹配当前提供方/模型的显式同意，分析已检索资料与目标目录。调用前后重新核验引用、权限和模型，返回至多24条候选，不自动保存。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [citations, modelFingerprint, confirmed]
              properties:
                citations: { type: array, minItems: 1, maxItems: 8, items: { $ref: '#/components/schemas/KnowledgeCitation' } }
                modelFingerprint: { type: string, pattern: '^[a-f0-9]{24}$' }
                confirmed: { type: boolean, const: true }
                mode: { type: string, enum: [exact, model], default: exact }
                targetIds: { type: array, minItems: 1, maxItems: 16, uniqueItems: true, items: { type: string }, description: 仅model模式可选；必须来自当前模型，用于缩小分析目录 }
                consent:
                  type: object
                  additionalProperties: false
                  required: [provider, model, confirmed]
                  properties:
                    provider: { type: string }
                    model: { type: string }
                    confirmed: { type: boolean, const: true }
      responses:
        '200': { description: 未持久化的候选与明确匹配方法 }
        '400': { description: 确认或引用无效 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: 模型或证据已变化 }
        '413': { description: 目标目录超过本轮安全预算 }
        '502': { description: 模型答复或关联目标契约无效 }
        '503': { description: 模型暂不可用，不降级冒充AI分析 }
  /semantic-operations/knowledge-library/model-views:
    get:
      tags: [SemanticOperations]
      operationId: listPrivateOntologyViews
      description: 仅当前租户、用户及角色的个人视图元信息，最多20个，不返回历史模型或原始资料。
      responses:
        '200': { description: 当前指纹及个人视图元信息 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: 模型在读取中变化 }
    post:
      tags: [SemanticOperations]
      operationId: savePrivateOntologyView
      description: 需要草稿保存权限。保存选中对象和有界坐标，事务内校验模型指纹与视图修订，不改变语义模型。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedRevision, label, selectedId, modelFingerprint, layout]
              properties:
                id: { type: string, format: uuid }
                expectedRevision: { type: integer, minimum: 0 }
                label: { type: string, minLength: 1, maxLength: 80 }
                selectedId: { type: string }
                modelFingerprint: { type: string, pattern: '^[a-f0-9]{24}$' }
                layout:
                  type: object
                  additionalProperties: false
                  required: [fingerprint, positions, scale, offset]
                  properties:
                    fingerprint: { type: string, pattern: '^[a-f0-9]{24}$' }
                    positions:
                      type: object
                      maxProperties: 500
                      additionalProperties:
                        type: object
                        additionalProperties: false
                        required: [x, y]
                        properties:
                          x: { type: number, minimum: 0, maximum: 10000 }
                          y: { type: number, minimum: 0, maximum: 50000 }
                    scale: { type: number, minimum: 0.5, maximum: 2.5 }
                    offset:
                      type: object
                      additionalProperties: false
                      required: [x, y]
                      properties:
                        x: { type: number, minimum: -10000, maximum: 10000 }
                        y: { type: number, minimum: -10000, maximum: 10000 }
      responses:
        '200': { description: 保存后的个人视图及修订 }
        '400': { description: 坐标、选中对象或输入格式无效 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: 当前私有范围内未找到该视图 }
        '409': { description: 模型或视图修订冲突 }
        '413': { description: 个人视图超过20个 }
  /semantic-operations/knowledge-library/model-views/{id}:
    get:
      tags: [SemanticOperations]
      operationId: readPrivateOntologyView
      description: 登录并重新校验权限、私有范围和当前模型指纹。旧模型视图返回冲突；链接不授予读取权限。
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: 当前授权版本的布局与选中对象 }
        '400': { description: 视图标识无效 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: 私有范围内无该视图 }
        '409': { description: 模型已变化，不能恢复旧布局 }
  /semantic-operations/knowledge-library/model-views/{id}/share:
    post:
      tags: [SemanticOperations]
      operationId: shareOntologyViewWithReviewers
      description: 需草稿保存及审核权限；将本人本角色的已保存布局复制为同租户审核人员可读快照，不共享私有资料或授予权限。最多20个有效、100条含撤回记录。
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedRevision, modelFingerprint]
              properties:
                expectedRevision: { type: integer, minimum: 1 }
                modelFingerprint: { type: string, pattern: '^[a-f0-9]{24}$' }
      responses:
        '200': { description: 新团队快照元信息，不返回个人视图标识或主体键 }
        '400': { description: 参数无效 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: 私有范围无源视图 }
        '409': { description: 模型变更、源修订冲突或重复分享 }
        '413': { description: 团队视图预算超限 }
  /semantic-operations/knowledge-library/team-model-views:
    get:
      tags: [SemanticOperations]
      operationId: listTeamOntologyViews
      description: 当前同租户审核人员可读的未撤回布局快照元信息，不返回坐标或资料。
      responses:
