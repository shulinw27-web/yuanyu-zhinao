          application/json:
            schema:
              type: object
              required: [candidateFingerprint, cases]
              properties:
                candidateFingerprint: { type: string, minLength: 24, maxLength: 24 }
                cases:
                  type: array
                  minItems: 2
                  maxItems: 24
                  items:
                    type: object
                    required: [planId, target, records]
                    oneOf:
                      - required: [expected]
                      - required: [expectedError]
                    properties:
                      planId: { type: string }
                      target: { type: string }
                      records: { type: array, maxItems: 500, items: { $ref: '#/components/schemas/GenericObject' } }
                      expected: { type: object, description: 必须包含方案全部输出指标及精确值 }
                      expectedError: { type: string, enum: [READ_ROOT_NOT_FOUND, READ_RECORD_SCOPE, READ_RECORD_CONFLICT, READ_REQUIRED_FIELD, READ_LOOKUP_NOT_UNIQUE, READ_EXPECTED_SINGLE_RECORD, READ_PRECONDITION_FAILED, READ_GRAPH_CYCLE, READ_DANGLING_EDGE, READ_EDGE_STATE_UNKNOWN, READ_EXPANSION_DEPTH_LIMIT] }
      responses:
        '200': { description: passed 或 failed 回放报告，不保存原始样本, content: { application/json: { schema: { $ref: '#/components/schemas/GenericObject' } } } }
        '403': { description: 无发布权限或认证身份 }
        '409': { description: 草稿指纹不匹配、案例格式无效、执行角色被拒绝或未配置方案 }
  /meta-models/oa-governance/case-replay:
    get:
      tags: [Governance]
      operationId: getOntologyCaseReplay
      x-page-permission: page.world.view
      x-button-permission: meta_model.draft.validate
      description: 读取当前租户与主体最近的只读样本回放报告，不含原始记录。
      responses:
        '200': { description: 报告或 not_run, content: { application/json: { schema: { $ref: '#/components/schemas/GenericObject' } } } }
        '403': { description: 无校验权限 }
    post:
      tags: [Governance]
      operationId: runOntologyCaseReplay
      x-page-permission: page.world.view
      x-button-permission: meta_model.draft.validate
      description: 对 1–100 个授权样本运行草稿与已发布定义。身份来自认证请求，不接受正文身份覆盖；样本不提交模型、不执行业务写入。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
                - allOf:
                    - $ref: '#/paths/~1meta-models~1oa-governance~1read-plan-replay/post/requestBody/content/application~1json/schema'
                    - type: object
                      required: [mode]
                      properties:
                        mode: { type: string, const: ontology-read }
                -
                  type: object
                  required: [candidateFingerprint, cases]
                  properties:
                    candidateFingerprint: { type: string, minLength: 24, maxLength: 24 }
                    cases:
                      type: array
                      minItems: 1
                      maxItems: 100
                      items:
                        type: object
                        required: [id, at, expected]
                        oneOf:
                          - required: [objectType, record]
                            properties:
                              kind: { type: string, const: decision }
                              expected: { type: string, enum: [needs_review, closed, in_progress, investigation_recommended, review_recommended] }
                          - required: [kind, knownAt, query, records, relations]
                            properties:
                              kind: { type: string, const: relation_history }
                              expected: { type: string, enum: [related, not_related, conflict, needs_review] }
                          - required: [kind, knownAt, query, records, mappings]
                            properties:
                              kind: { type: string, const: identity_mapping }
                              expected: { type: string, enum: [same_entity, different_entity, unresolved, conflict, needs_review] }
                        properties:
                          id: { type: string }
                          kind: { type: string, enum: [decision, relation_history, identity_mapping] }
                          objectType: { type: string }
                          at: { type: string, format: date-time }
                          knownAt: { type: string, format: date-time, description: 历史已知截止时间，不早于 at }
                          expected: { type: string }
                          record: { $ref: '#/components/schemas/GenericObject' }
                          query:
                            oneOf:
                              - { type: object, required: [from, to, predicate], properties: { from: { $ref: '#/components/schemas/GenericObject' }, to: { $ref: '#/components/schemas/GenericObject' }, predicate: { type: string } } }
                              - { type: object, required: [left, right], properties: { left: { $ref: '#/components/schemas/GenericObject' }, right: { $ref: '#/components/schemas/GenericObject' } } }
                          records: { type: array, minItems: 1, maxItems: 200, items: { $ref: '#/components/schemas/GenericObject' } }
                          relations: { type: array, maxItems: 500, items: { $ref: '#/components/schemas/GenericObject' } }
                          mappings: { type: array, maxItems: 500, items: { $ref: '#/components/schemas/GenericObject' } }
      responses:
        '200': { description: passed 或 failed 报告；失败不是业务执行失败，未执行任何业务动作, content: { application/json: { schema: { $ref: '#/components/schemas/GenericObject' } } } }
        '403': { description: 无校验权限 }
        '409': { description: 草稿版本已变化或身份不完整 }
