      description: 用户明确保存个人资料；不是发布企业制度或模型。企业/主体/角色由服务器确定，拒绝客户端 ACL 字段。创建 expectedRevision=0，更新必须提供当前修订。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedRevision, title, source, sourceVersion, kind, text]
